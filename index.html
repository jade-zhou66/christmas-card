<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">

<title>愿星光照耀你的未来 · 圣诞快乐</title>
<style>
*{box-sizing:border-box}
body{margin:0;color:#f6eddb;background:radial-gradient(ellipse at 30% 52%,#133436,#081723 52%,#060e18 85%);font-family:system-ui,sans-serif}
main{min-height:100svh;max-width:1150px;margin:auto;display:grid;grid-template-columns:1.2fr 1fr;align-items:center;padding:24px 42px;position:relative}
canvas{width:100%;height:min(84svh,690px);display:block}
section{padding:30px 0 44px 22px}
.eyebrow{font:700 clamp(22px,3.1vw,36px)/1.15 Georgia,serif;letter-spacing:.06em;color:#f4cb8c;text-wrap:balance}
.recipient{display:block;margin-top:8px;font-size:clamp(23px,3.3vw,39px);letter-spacing:.03em;color:#fff0cf}
h1{margin:.35em 0 .25em;font-family:"Songti SC","Noto Serif CJK SC",serif;font-size:clamp(31px,4.45vw,62px);font-weight:500;letter-spacing:.07em}
.wish{margin:25px 0 14px;color:#e8bc80;font-family:serif;font-size:20px;letter-spacing:.25em}
p{color:#d6ded8;line-height:1.95;font-size:16px}
@media(max-width:700px){main{display:block;padding:8px 24px 30px}canvas{height:clamp(290px,58svh,505px)}section{text-align:center;padding:0}.wish{margin:16px auto}h1{margin-top:.2em}p{margin:10px auto}}

[hidden]{display:none!important}

.intro{min-height:100svh;position:relative;isolation:isolate;overflow:hidden;
  display:grid;place-items:center;padding:18px 16px;
  background:radial-gradient(ellipse at 50% 30%,#fff0bb 0%,#efc66f 48%,#b9762f 100%)}
.intro-content{display:grid;place-items:center;width:100%}
.intro-act{grid-area:1/1;position:relative;display:grid;place-items:center;width:100%}
.intro-portrait{width:min(76vw,53svh,420px);aspect-ratio:1;display:grid;place-items:center}
.santa,.lebron{display:block;width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 10px 12px #82401232)}
.santa{overflow:visible}
.intro-line,.speech-bubble{position:absolute;margin:0;text-align:center;color:#4c2914;
  font:700 clamp(19px,4.8vw,36px)/1.2 Georgia,serif}
.intro-line{top:calc(100% + 8px);white-space:pre-wrap}
.speech-bubble{bottom:calc(100% - 4px);padding:12px 20px;min-width:min(82vw,330px);
  border-radius:22px;background:#fff8df;box-shadow:0 8px 24px #87441235}
.speech-bubble::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:10px solid transparent;border-top-color:#fff8df}
.intro-snow{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.intro-snow i{position:absolute;top:-12%;left:var(--x);width:var(--size);height:var(--size);
  background:#fff8de;border-radius:50%;filter:blur(var(--blur));opacity:var(--opacity);
  animation:gold-snow var(--time) var(--delay) linear infinite}
@keyframes gold-snow{from{transform:translate(0,0)}to{transform:translate(var(--drift),112svh)}}
@media(prefers-reduced-motion:reduce){.intro-snow i{animation-play-state:paused}}
.audio-hint{position:fixed;z-index:2;bottom:max(14px,env(safe-area-inset-bottom));
  left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);width:max-content;
  margin:0;padding:6px 12px;border-radius:999px;background:#21160fde;color:#fff3d9;font-size:13px}
.waiting-for-reveal{visibility:hidden}

.montage-act{position:absolute;inset:0}
.montage-figure{position:absolute;left:var(--end-x);top:var(--end-y);
  width:auto;height:min(40svh,310px);max-width:30vw;object-fit:contain;
  transform:translate(-50%,-50%);visibility:hidden;
  filter:drop-shadow(0 8px 10px #8240122e)}
.montage-figure.entered{visibility:visible;animation:montage-enter 1.1s cubic-bezier(.22,.7,.24,1) both}
@keyframes montage-enter{
  from{opacity:0;left:var(--start-x);top:var(--start-y)}
  28%{opacity:1}
  to{opacity:1;left:var(--end-x);top:var(--end-y)}
}
@media(prefers-reduced-motion:reduce){.montage-figure.entered{animation:none}}

.gift{position:relative;display:block;aspect-ratio:1.12;
  filter:drop-shadow(0 9px 14px #74311445)}
.gift-base,.gift-lid,.gift-bow{position:absolute;display:block}
.gift-base{z-index:1;left:8%;right:8%;top:40%;bottom:0;border-radius:3% 3% 8% 8%;
  background:linear-gradient(90deg,transparent 42%,#eab353 42%,#ffe5a1 50%,#eab353 58%,transparent 58%),
    linear-gradient(145deg,#d8444d,#8d1735)}
.gift-lid{z-index:2;inset:0 0 auto;height:48%;transform-origin:10% 88%}
.gift-lid::before{content:"";position:absolute;inset:62% 0 0;border-radius:7%;
  background:linear-gradient(90deg,transparent 42%,#edbd60 42%,#fff0af 50%,#edbd60 58%,transparent 58%),
    linear-gradient(#ed6670,#bb253d);box-shadow:0 4px 6px #67112840}
.gift-bow{left:50%;top:3%;width:37%;height:62%;transform:translateX(-50%)}
.gift-bow::before,.gift-bow::after{content:"";position:absolute;top:5%;width:62%;height:84%;
  border:5px solid #ffe297;border-radius:70% 70% 22% 70%;box-shadow:inset 0 0 0 1px #b95f26}
.gift-bow::before{right:47%;transform:rotate(18deg)}
.gift-bow::after{left:47%;transform:scaleX(-1) rotate(18deg)}
.gift-trigger{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);
  width:clamp(88px,21vw,164px);padding:0;border:0;background:none;cursor:pointer;border-radius:16px;
  animation:gift-appear .5s ease-out both}
.gift-trigger .gift{width:100%}
.gift-trigger:focus-visible{outline:3px solid #69321d;outline-offset:8px}
@keyframes gift-appear{from{opacity:0;transform:translate(-50%,-50%) scale(.76)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.james-gift-act{position:absolute;inset:0;
  --gift-size:min(65vw,32svh,288px);--gift-bottom:3svh;
  --box-rim:calc(var(--gift-bottom) + var(--gift-size) * .5357)}
.james-rise-window{position:absolute;inset:14% 0 calc(var(--box-rim) - 6px);overflow:hidden;display:grid;justify-items:center;align-items:end}
.james-rise-window .intro-portrait{width:min(86vw,55svh,455px)}
.james-gift{position:absolute;z-index:1;bottom:var(--gift-bottom);left:50%;transform:translateX(-50%);width:var(--gift-size)}
.james-gift .gift-lid{animation:gift-open .8s ease-out both}
@keyframes gift-open{to{transform:translate(-42%,-23%) rotate(-34deg)}}
.james-entering{animation:james-rise 2.4s .35s cubic-bezier(.23,.7,.25,1) both}
@keyframes james-rise{from{transform:translateY(100%)}to{transform:translateY(0)}}
.james-gift-act .speech-bubble{z-index:2;left:50%;top:clamp(12px,12svh,90px);bottom:auto;
  transform:translateX(-50%);max-width:90vw;width:max-content}
@media(prefers-reduced-motion:reduce){
  .gift-trigger,.james-entering{animation:none}
  .james-gift .gift-lid{animation:none;transform:translate(-42%,-23%) rotate(-34deg)}
}

.james-gift-act .card-bubble{background:#f5e9ff;color:#4e315e}
.card-bubble::after{border-top-color:#f5e9ff}
.card-act{position:absolute;inset:0;display:grid;place-items:center}
.card-display{position:relative;width:min(48vw,36svh,310px)}
.card-cover{display:block;width:100%;height:auto;transform:rotate(-7deg);
  filter:drop-shadow(0 16px 18px #70421f45)}
.card-invitation{position:absolute;top:50%;left:calc(100% + min(3vw,24px));margin:0;
  transform:translateY(-50%);width:max-content;color:#65416f;font-size:clamp(14px,2.6vw,20px);
  font-weight:650;line-height:1.45}
@media(max-width:360px){.card-display{width:44vw}.card-invitation{left:calc(100% + 6px)}}
</style>
</head>

        <path d="M98 149q23 13 47 2m-62 30q38 20 76 0m-81 32q45 14 91-1" fill="none" stroke="#ffe6a6" stroke-width="2.5"/>

        <g fill="#fff5fe"><circle cx="52" cy="70" r="3"/><circle cx="183" cy="97" r="3"/><circle cx="58" cy="164" r="3"/><circle cx="192" cy="190" r="4"/><circle cx="177" cy="57" r="3"/></g>
        <path d="M56 100v22m-11-11h22m115 20v23m-11-11h22" stroke="#fff7ff" stroke-width="2.5" stroke-linecap="round"/>
        <rect x="73" y="232" width="34" height="23" rx="3" fill="#bc647d"/><path d="M90 232v23m-17-13h34" stroke="#ffe3a4" stroke-width="3"/>

<main id="christmas-card">
<canvas aria-label="挂着礼物盒、史迪奇和蜡笔小新公仔的旋转圣诞树" role="img"></canvas>
<section>
<div class="eyebrow"><span data-card-line>MERRY CHRISTMAS</span><span class="recipient" data-card-line>Thomas Yang</span></div>
<h1 data-card-line>愿星光照耀你的未来</h1>
<p class="wish" data-card-line>好运与欢喜同在</p>
<p data-card-line>希望这个圣诞的你被温暖、快乐和爱包围！</p>
</section>
</main>
<audio src="bells.wav" autoplay preload="auto" loop></audio>
<p class="audio-hint" id="audio-hint" role="status" hidden>轻触画面开启音乐</p>
<script>
const audio = document.querySelector("audio");
const audioHint = document.querySelector("#audio-hint");
audio.volume = .64;

function hideAudioHint() {
  audioHint.hidden = true;
  document.removeEventListener("click", startMusic);
  document.removeEventListener("keydown", startMusic);
  document.removeEventListener("WeixinJSBridgeReady", startMusic);
}

async function startMusic() {
  try {
    await audio.play();
    hideAudioHint();
  } catch (error) {
    if (error.name === "NotAllowedError" && audio.paused) audioHint.hidden = false;
  }
}

audio.addEventListener("playing", hideAudioHint, {once: true});
document.addEventListener("click", startMusic);
document.addEventListener("keydown", startMusic);
document.addEventListener("WeixinJSBridgeReady", startMusic);
startMusic();
const canvas=document.querySelector("canvas");
const ctx=canvas.getContext("2d");
const reduced=matchMedia("(prefers-reduced-motion: reduce)");
const tau=Math.PI*2;
const random=Math.random;
const colors=["#6ddbad","#dcfbce","#f9c27d","#fff0b7","#e58f87"];
const tree=Array.from({length:1350},()=>{
  const h=random();
  const tier=1-.28*((h*7)%1);
  return {h,r:(.025+h*.47)*tier*(.36+.64*Math.sqrt(random())),a:random()*tau,
    size:.55+random()*1.2,color:colors[Math.floor(random()*colors.length)],seed:random()*tau};
});
for(let i=0;i<300;i++){
  const h=i/299;
  tree.push({h,r:.035+h*.46,a:h*tau*5,seed:h*50,size:1.4,color:"#ffd482",ribbon:true});
}
// Stagger three ornaments around each level of the rotating tree.
const ornaments = [.32, .56, .81].flatMap((h, level) =>
  [0, 1, 2].map(index => ({
    h,
    r: (.025 + h * .47) * (1 - .28 * ((h * 7) % 1)),
    a: (index / 3 + level / 9) * tau,
    ornament: (index + level) % 3,
  }))
);
const ornamentArt = new Image();
ornamentArt.src = "tree-ornaments.svg";
const ornamentRegions = [[13, 9, 70, 75], [99, 12, 90, 80], [209, 7, 65, 86]];
const treeElements = tree.concat(ornaments);

function drawOrnament(kind, x, y, depth, size) {
  if (depth < -.025 || !ornamentArt.naturalWidth) return;
  const [sx, sy, sw, sh] = ornamentRegions[kind];
  const width = size * sw / sh;
  ctx.globalAlpha = Math.min(1, (depth + .025) / .095);
  ctx.strokeStyle = "#ffd68e";
  ctx.lineWidth = Math.max(1, size * .025);
  ctx.beginPath();
  ctx.moveTo(x, y - size * .14);
  ctx.lineTo(x, y + size * .02);
  ctx.stroke();
  ctx.drawImage(ornamentArt, sx, sy, sw, sh, x - width / 2, y, width, size);
}
const snow=Array.from({length:85},()=>({x:random(),y:random(),speed:.01+random()*.035,r:.45+random()*1.45}));
let width,height;
function resize(){
  const ratio=Math.min(2,devicePixelRatio||1);
  width=canvas.clientWidth;
  height=canvas.clientHeight;
  canvas.width=Math.round(width*ratio);
  canvas.height=Math.round(height*ratio);
  ctx.setTransform(ratio,0,0,ratio,0,0);
}
window.addEventListener("resize",resize);
function draw(ms){
  const time=reduced.matches?0:ms/1000;
  ctx.clearRect(0,0,width,height);
  const scale=Math.min(width*.94,height*.82);
  const cx=width*.5;
  const top=height*.13;
  const base=top+scale;
  ctx.fillStyle="#dceeea";
  for(const flake of snow){
    ctx.globalAlpha=.16+flake.r*.2;
    ctx.beginPath();
    ctx.arc(flake.x*width+5*Math.sin(time+flake.y*20),((flake.y+time*flake.speed)%1)*height,flake.r,0,tau);
    ctx.fill();
  }
  ctx.globalAlpha=1;
  const glow=ctx.createRadialGradient(cx,base,0,cx,base,scale*.54);
  glow.addColorStop(0,"#82d8ac38");
  glow.addColorStop(1,"#82d8ac00");
  ctx.save();
  ctx.translate(cx,base);
  ctx.scale(1,.22);
  ctx.translate(-cx,-base);
  ctx.fillStyle=glow;
  ctx.fillRect(cx-scale,base-scale,scale*2,scale*2);
  ctx.restore();
  const projected=treeElements.map(point=>{
    const a=point.a+time*.43;
    return {point,x:Math.cos(a)*point.r,z:Math.sin(a)*point.r};
  }).sort((a,b)=>a.z-b.z);
  for(const {point,x,z} of projected){
    const perspective=1+z*.36;
    const px=cx+x*scale*perspective;
    const py=top+point.h*scale+z*scale*.19;
    if (point.ornament !== undefined) {
      drawOrnament(point.ornament, px, py, z, Math.min(52, scale * .105) * perspective);
      continue;
    }
    const twinkle=.78+.22*Math.sin(time*2.2+point.seed);
    ctx.globalAlpha=Math.min(1,(.61+z*.71)*twinkle+(point.ribbon?.18:0));
    ctx.fillStyle=point.color;
    if(point.ribbon){ctx.shadowBlur=9;ctx.shadowColor=point.color;}
    ctx.beginPath();
    ctx.arc(px,py,point.size*perspective*(scale/470+.48)*.75,0,tau);
    ctx.fill();
    ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;
  ctx.fillStyle="#fff0b5";
  ctx.shadowColor="#ffcd79";
  ctx.shadowBlur=28;
  const sy=top-9;
  const starSize=scale*.055;
  ctx.beginPath();
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4-Math.PI/2;
    const r=i%2===0?starSize:starSize*.25;
    const x=cx+Math.cos(a)*r;
    const y=sy+Math.sin(a)*r;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.closePath();ctx.fill();ctx.shadowBlur=0;
  requestAnimationFrame(draw);
}
const opening = document.querySelector("#christmas-intro");
const santaAct = document.querySelector("#santa-act");
const santaGreeting = document.querySelector("#santa-greeting");
const montageAct = document.querySelector("#james-montage");
const openGift = document.querySelector("#open-gift");
const jamesAct = document.querySelector("#james-act");
const jamesPortrait = document.querySelector("#james-portrait");
const jamesBubble = document.querySelector("#james-bubble");
const jamesGreeting = document.querySelector("#james-greeting");
const cardBubble = document.querySelector("#card-bubble");
const cardWords = document.querySelector("#card-words");
const cardAct = document.querySelector("#card-act");
const cardInvitation = document.querySelector("#card-invitation");
const card = document.querySelector("#christmas-card");

function showTree() {
  opening.hidden = true;
  const laterLines = Array.from(card.querySelectorAll("[data-card-line]")).slice(1);
  laterLines.forEach((line, index) => {
    line.classList.add("waiting-for-reveal");
    setTimeout(() => line.classList.remove("waiting-for-reveal"), (index + 1) * 2000);
  });
  card.hidden = false;
  resize();
  requestAnimationFrame(draw);
}

function showCard() {
  jamesAct.hidden = true;
  cardAct.hidden = false;
  setTimeout(() => {
    cardInvitation.hidden = false;
    setTimeout(showTree, 3000);
  }, 3000);
}

function offerCard() {
  jamesBubble.hidden = true;
  cardBubble.hidden = false;
  setTimeout(() => {
    cardWords.classList.remove("waiting-for-reveal");
    setTimeout(showCard, 3000);
  }, 2000);
}

function showJames() {
  clearTimeout(giftTimer);
  montageAct.hidden = true;
  jamesAct.hidden = false;
  const entranceDuration = reduced.matches ? 0 : 2750;
  jamesPortrait.classList.add("james-entering");
  setTimeout(() => {
    jamesBubble.hidden = false;
    setTimeout(() => {
      jamesGreeting.classList.remove("waiting-for-reveal");
      setTimeout(offerCard, 5000);
    }, 3000);
  }, entranceDuration + 2000);
}

let giftTimer;
openGift.addEventListener("click", showJames, {once: true});

function showMontage() {
  santaAct.hidden = true;
  montageAct.hidden = false;
  const interval = 1200;
  const figures = montageAct.querySelectorAll(".montage-figure");
  figures.forEach((figure, index) => {
    setTimeout(() => figure.classList.add("entered"), index * interval);
  });
  setTimeout(() => {
    openGift.hidden = false;
    giftTimer = setTimeout(showJames, 5000);
  }, figures.length * interval);
}

card.hidden = true;
opening.hidden = false;
setTimeout(() => {
  santaGreeting.hidden = false;
  setTimeout(showMontage, 3000);
}, 4000);
</script>
</body>
